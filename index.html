<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Hanoi Tower Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f2f2f2;
        }

        h1 {
            color: #333;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .towers {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            margin-top: 50px;
            height: 400px;
        }

        .tower {
            width: 30%;
            height: 350px;
            position: relative;
            border-bottom: 10px solid #ee5353;
        }

        /* Vertical rod */
        .tower::before {
            content: "";
            position: absolute;
            width: 20px;
            height: 300px;
            background-color: #df551e;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .tower h2 {
            position: absolute;
            bottom: -60px;
            background-color: #2ecc71;
            width: 100%;
        }

        .disk {
            position: absolute;
            height: 35px;
            border-radius: 8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            text-align: center;
            color: white;
            font-weight: bold;
            line-height: 35px;
        }

        .disk1 {
            width: 70px;
            background-color: #e74c3c;
        }

        .disk2 {
            width: 100px;
            background-color: #3498db;
        }

        .disk3 {
            width: 130px;
            background-color: #2ecc71;
        }

        .disk4 {
            width: 160px;
            background-color: #f39c12;
        }

        .disk5 {
            width: 190px;
            background-color: #9b59b6;
        }

        #message {
            margin-top: 80px;
            font-size: 18px;
            font-weight: bold;
            color: #444;
        }
    </style>
</head>

<body>

    <h1>Tower of Hanoi</h1>

    <label>
        Number of Disks:
        <select id="diskCount">
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>
    </label>

    <br>

    <button onclick="startGame()">Start Game</button>
    <button onclick="resetGame()">Reset</button>

    <div class="towers">

        <div class="tower" id="A">
            <h2>Source (A)</h2>
        </div>

        <div class="tower" id="B">
            <h2>Auxiliary (B)</h2>
        </div>

        <div class="tower" id="C">
            <h2>Destination (C)</h2>
        </div>

    </div>

    <div id="message">
        Select the number of disks and click Start Game.
    </div>

    

<script src="script.js"></script>
</body>

</html>
